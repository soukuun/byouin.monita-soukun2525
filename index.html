<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>すくば記念病院 モニター V19</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; overflow-y: auto; }
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #main-content { display: none; }
        .header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #0055ff; display: flex; justify-content: space-between; align-items: center; }
        .credit { font-size: 10px; color: #aaa; text-align: right; }
        .layout { display: grid; grid-template-columns: 1.6fr 1.4fr; gap: 15px; margin-top: 10px; }
        
        /* モニターエリア */
        .monitor-panel { background: #050505; border: 2px solid #333; padding: 15px; border-radius: 5px; display: flex; flex-direction: column; gap: 10px; }
        canvas { width: 100%; height: 50px; background: #000; }
        .v-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .v-box { background: #111; padding: 8px; text-align: center; border-radius: 5px; border: 1px solid #222; }
        .v-num { font-size: 38px; font-weight: bold; line-height: 1; }
        
        /* 左下の新機能：バイタル履歴グラフ */
        .history-panel { background: #0a0a0a; border: 1px solid #444; padding: 10px; border-radius: 5px; margin-top: 5px; }
        .history-title { font-size: 10px; color: #0f0; margin-bottom: 5px; }
        #history-canvas { width: 100%; height: 80px; background: #000; }

        /* 操作パネル */
        .control-panel { background: #1a1a1a; padding: 15px; border-radius: 5px; border: 1px solid #444; height: 88vh; overflow-y: auto; }
        .section-title { font-size: 11px; color: #00aaff; border-bottom: 1px solid #00aaff; margin-bottom: 8px; font-weight: bold; padding-top: 5px; }
        input, select { width: 100%; padding: 8px; background: #000; border: 1px solid #555; color: #fff; margin-bottom: 8px; box-sizing: border-box; }
        .drug-input-group { display: flex; gap: 5px; margin-bottom: 8px; }
        .drug-input-group input { margin-bottom: 0; }
        
        .btn { width: 100%; padding: 10px; margin-bottom: 5px; font-weight: bold; cursor: pointer; border-radius: 4px; border: none; }
        .btn-blue { background: #c0392b; color: #fff; }
        .btn-green { background: #27ae60; color: #fff; }
        .btn-orange { background: #e67e22; color: #fff; }
        .btn-yellow { background: #f1c40f; color: #000; }
        .drug-log { font-size: 11px; color: #0f0; background: #000; padding: 5px; height: 80px; overflow-y: auto; border: 1px solid #333; margin-top: 5px; }

        #shock-flash { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 2000; }
        #pupil-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #fff 0%, #000 35%); z-index: 500; opacity: 0.8; pointer-events: none; }
        .emergency-active { animation: flash 0.6s infinite; }
        @keyframes flash { 0% { background: #000; } 50% { background: #300; } }
    </style>
</head>
<body>

<div id="shock-flash"></div>
<div id="pupil-overlay"></div>

<div id="lock-screen">
    <div style="background:#1a1a1a; padding:30px; border:2px solid #0055ff; text-align:center; border-radius:10px;">
        <h2 style="color:#0055ff;">SECURITY LOGIN</h2>
        <input type="password" id="pw-input" placeholder="パスワードを入力">
        <button class="btn btn-green" onclick="checkPassword()">ログイン</button>
    </div>
</div>

<div id="main-content">
    <div class="header">
        <div>
            <div style="font-size:16px; font-weight:bold;">🏥 すくば記念病院 高度医療モニター V19</div>
            <div class="credit">制作：soukun2525（ディスコードID）</div>
        </div>
        <div id="clock">00:00:00</div>
    </div>

    <div class="layout">
        <div class="monitor-panel" id="monitor">
            <div style="color:#0f0; font-size:9px;">心電図(ECG)</div><canvas id="ecg"></canvas>
            <div style="color:#0ff; font-size:9px;">脈波(SpO2)</div><canvas id="spo2"></canvas>
            <div class="v-grid">
                <div class="v-box"><div style="font-size:9px;color:#0f0;">心拍数(HR)</div><div id="h-num" class="v-num" style="color:#0f0">72</div></div>
                <div class="v-box"><div style="font-size:9px;color:#ff00ff;">血圧(BP)</div><div id="b-num" class="v-num" style="color:#ff00ff">118</div></div>
                <div class="v-box"><div style="font-size:9px;color:#0ff;">酸素(SpO2)</div><div id="s-num" class="v-num" style="color:#0ff">98</div></div>
                <div class="v-box"><div style="font-size:9px;color:#ff9900;">体温(BT)</div><div id="t-num" class="v-num" style="color:#ff9900">36.5</div></div>
            </div>
            
            <div class="history-panel">
                <div class="history-title">📈 バイタル履歴（30秒間）</div>
                <canvas id="history-canvas"></canvas>
                <div id="iv-timer" style="margin-top:5px; font-size:11px; color:#f1c40f;">点滴：停止中</div>
            </div>
            
            <div id="sys-msg" style="margin-top:5px; color:#f1c40f; font-size:11px; font-weight:bold;">システム正常</div>
        </div>

        <div class="control-panel">
            <div class="section-title">🔊 設定</div>
            <div style="display:flex; gap:5px;">
                <select id="sound-type"><option value="chime">チャイム</option><option value="beep">警告音</option></select>
                <select id="voice-select"><option value="normal">女性</option><option value="male">男性</option><option value="robot">ロボ</option></select>
            </div>

            <div class="section-title">💊 薬剤自由投与</div>
            <div class="drug-input-group">
                <input type="text" id="drug-name" placeholder="薬の名前">
                <input type="number" id="drug-amount" placeholder="量" style="width:60px;">
                <select id="drug-unit" style="width:70px;"><option value="mg">mg</option><option value="ml">ml</option><option value="g">g</option></select>
            </div>
            <button class="btn btn-green" onclick="administerDrugFree()">💉 薬剤を投与する</button>
            <div id="drug-log" class="drug-log">【投与履歴】</div>

            <div class="section-title">⚡️ 救急処置</div>
            <button class="btn btn-blue" onclick="asystole()">🚨 心停止(フラットライン)</button>
            <button class="btn btn-orange" onclick="aedShock()">⚡️ 電気ショック(DC) 実行</button>
            <button class="btn btn-yellow" onmousedown="pupil(true)" onmouseup="pupil(false)">🔦 瞳孔ライト</button>
            <button class="btn btn-green" onclick="startIV()">🩸 点滴タイマー開始</button>

            <div class="section-title">🏥 院内・搬送音</div>
            <button id="amb-btn" class="btn" style="background:#ddd; color:#333;" onclick="toggleAmbulance()">🚑 救急サイレン</button>
            <button class="btn" style="background:#ddd; color:#333;" onclick="playNurseCall()">🔔 ナースコール</button>

            <div class="section-title">🎤 院内放送</div>
            <input type="text" id="free-text" placeholder="放送内容...">
            <button class="btn btn-green" onclick="executeBroadcast(document.getElementById('free-text').value)">📢 放送</button>
            <input type="text" id="custom-place" value="救急科">
            <button class="btn btn-blue" onclick="executeBroadcast('コードブルー、コードブルー、' + document.getElementById('custom-place').value)">🏥 コード・ブルー</button>

            <button class="btn" style="background:#555; color:#fff; margin-top:5px;" onclick="stopAll()">🔄 全復旧</button>
        </div>
    </div>
</div>

<audio id="chime-audio" src="sei_ge_pinponpan01.mp3"></audio>

<script>
    const CORRECT_PW = "sukuba.monita-";
    let hr = 72, spo2 = 98, bp = 118, bt = 36.5, isDead = false, ivTime = 0, ivInterval = null;
    let audioCtx = null, ambOsc = null, ambInterval = null, deadOsc = null;
    let hrHistory = new Array(30).fill(72);

    function checkPassword() {
        if (document.getElementById('pw-input').value === CORRECT_PW) {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            draw('ecg', '#0f0'); draw('spo2', '#0ff'); drawHistory();
            setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        }
    }

    function administerDrugFree() {
        const name = document.getElementById('drug-name').value || "未指定の薬剤";
        const amount = document.getElementById('drug-amount').value || "0";
        const unit = document.getElementById('drug-unit').value;
        const fullMsg = `${name} ${amount}${unit}`;
        const time = new Date().toLocaleTimeString();
        const log = document.getElementById('drug-log');
        log.innerHTML += `<div>${time} - ${fullMsg} 投与</div>`;
        log.scrollTop = log.scrollHeight;
        speak(fullMsg + "、投与しました。");
    }

    function drawHistory() {
        const c = document.getElementById('history-canvas');
        const ctx = c.getContext('2d');
        setInterval(() => {
            hrHistory.push(hr); hrHistory.shift();
            ctx.clearRect(0,0,c.width,c.height);
            ctx.strokeStyle = "#0f0"; ctx.lineWidth = 2; ctx.beginPath();
            for(let i=0; i<hrHistory.length; i++) {
                let x = (c.width / 29) * i;
                let y = c.height - (hrHistory[i] / 200 * c.height);
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.stroke();
        }, 1000);
    }

    function pupil(on) { document.getElementById('pupil-overlay').style.display = on ? 'block' : 'none'; }
    function startIV() { if (ivInterval) clearInterval(ivInterval); ivTime = 0; ivInterval = setInterval(() => { ivTime++; let m = Math.floor(ivTime/60); let s = ivTime%60; document.getElementById('iv-timer').innerText = `点滴：経過時間 ${m}分${s}秒`; }, 1000); }

    function asystole() {
        isDead = true; hr = 0; spo2 = 0; bp = 0;
        document.getElementById('sys-msg').innerText = "【警告】心停止"; document.getElementById('sys-msg').style.color = "red";
        if (deadOsc) deadOsc.stop();
        deadOsc = audioCtx.createOscillator(); const g = audioCtx.createGain();
        deadOsc.connect(g); g.connect(audioCtx.destination);
        deadOsc.frequency.value = 800; g.gain.value = 0.02; deadOsc.start();
    }

    function aedShock() {
        if (deadOsc) { deadOsc.stop(); deadOsc = null; }
        speak("ショックします離れて！３２１ショック！");
        setTimeout(() => {
            document.getElementById('shock-flash').style.display = 'block';
            setTimeout(() => { document.getElementById('shock-flash').style.display = 'none'; }, 100);
            if (isDead) { isDead = false; hr = 82; spo2 = 97; bp = 114; document.getElementById('sys-msg').innerText = "心拍再開"; document.getElementById('sys-msg').style.color = "#0f0"; }
        }, 4000);
    }

    function toggleAmbulance() {
        if (ambInterval) { clearInterval(ambInterval); ambInterval = null; if (ambOsc) { ambOsc.stop(); ambOsc = null; } document.getElementById('amb-btn').style.background = "#ddd"; }
        else { document.getElementById('amb-btn').style.background = "#ffcccc"; let h = true; const ps = () => { if (ambOsc) ambOsc.stop(); ambOsc = audioCtx.createOscillator(); const g = audioCtx.createGain(); ambOsc.connect(g); g.connect(audioCtx.destination); ambOsc.frequency.value = h ? 960 : 770; g.gain.value = 0.04; ambOsc.start(); h = !h; }; ps(); ambInterval = setInterval(ps, 650); }
    }

    function playNurseCall() { const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 1100; g.gain.value = 0.05; o.start(); setTimeout(() => o.stop(), 300); }

    setInterval(() => {
        if (!document.getElementById('main-content').offsetParent || isDead) return;
        hr += (Math.random() > 0.5 ? 2 : -2); if(hr < 55) hr=65;
        document.getElementById('h-num').innerText = Math.max(0, hr);
        document.getElementById('s-num').innerText = Math.max(0, spo2);
        document.getElementById('b-num').innerText = Math.max(0, bp);
        document.getElementById('t-num').innerText = bt.toFixed(1);
    }, 890);

    function executeBroadcast(text) {
        if(!text) return;
        const soundType = document.getElementById('sound-type').value;
        if (soundType === 'chime') {
            const chime = document.getElementById('chime-audio'); chime.volume = 0.5; chime.currentTime = 0;
            chime.play().then(() => { setTimeout(() => { speak(text); }, 3500); });
        } else {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 800; g.gain.value = 0.03; o.start(); setTimeout(() => { o.stop(); speak(text); }, 800);
        }
    }

    function speak(text) {
        window.speechSynthesis.cancel(); const utter = new SpeechSynthesisUtterance(text);
        const vt = document.getElementById('voice-select').value; utter.lang = 'ja-JP';
        if (vt === 'male') { utter.pitch = 0.6; utter.rate = 0.8; }
        else if (vt === 'robot') { utter.pitch = 1.8; utter.rate = 1.3; }
        window.speechSynthesis.speak(utter);
    }

    function stopAll() {
        isDead = false; hr = 72; spo2 = 98; bp = 118;
        if (deadOsc) { deadOsc.stop(); deadOsc = null; }
        if (ambInterval) toggleAmbulance();
        document.getElementById('monitor').classList.remove('emergency-active');
        document.getElementById('sys-msg').innerText = "システム正常";
        document.getElementById('sys-msg').style.color = "#f1c40f";
        document.getElementById('drug-log').innerHTML = "【投与履歴】";
        window.speechSynthesis.cancel(); clearInterval(ivInterval);
        document.getElementById('iv-timer').innerText = "点滴：停止中";
    }

    function draw(id, color) {
        const c = document.getElementById(id); const ctx = c.getContext('2d'); let x = 0;
        function r(t) {
            ctx.fillStyle = "rgba(0,0,0,0.15)"; ctx.fillRect(x, 0, 20, c.height);
            ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, 25);
            let y = 25; if (isDead) y = 25;
            else if (Math.random() < (hr/60)*0.04) y = 5 + Math.random() * 40;
            else if (t % (60000/hr) < 50) y = 10;
            x += (hr/60)*2 + Math.random(); if (x > c.width) x = 0;
            ctx.lineTo(x, y); ctx.stroke(); requestAnimationFrame(r);
        }
        requestAnimationFrame(r);
    }
</script>
</body>
</html>
